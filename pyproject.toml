[project]
name = "ai-multi-agent-crypto-trading-platform"
version = "0.2.0"
description = "Bybit research trading agent and read-only FastAPI foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pybit>=5.17.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "PyJWT[crypto]>=2.9.0",
    "openai>=1.55.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
